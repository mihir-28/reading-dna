name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build install archive
        run: python scripts/package_release.py --output dist --tag "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/reading-dna-*.zip
          generate_release_notes: true
