name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build install archive
        run: python scripts/package_release.py --output dist --tag "$GITHUB_REF_NAME"
      - name: Prepare release notes from changelog
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python scripts/release_notes.py --version "$version" --output dist/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Reading DNA ${{ steps.notes.outputs.version }}
          body_path: dist/release-notes.md
          files: dist/reading-dna-*.zip
